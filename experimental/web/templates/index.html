<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomica Terminal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="terminal-shell" aria-label="Taxonomica terminal">
        <pre id="terminal-screen" class="terminal-screen">Loading Taxonomica...</pre>
        <form id="terminal-form" class="terminal-input-row" autocomplete="off">
            <label id="terminal-prompt" for="terminal-input">Prompt</label>
            <input
                id="terminal-input"
                name="command"
                type="text"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autofocus
            >
            <button type="submit">Enter</button>
            <button type="button" id="reset-button">Reset</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
